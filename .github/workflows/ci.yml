name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  audit:
    name: bootstrap + license/SBOM gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install project dependencies (so the audit scans what we actually ship)
        run: |
          pip install -e ".[dev]"
          pip install -e "./services/investigate[dev]"
          pip install -e "./services/adjudicate[dev]"
          npm install --no-audit --no-fund
          go mod tidy

      - name: Install audit tooling
        run: |
          cargo install cargo-deny --locked
          go install github.com/google/go-licenses@latest
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: make bootstrap
        run: make bootstrap

      - name: make audit
        run: make audit

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-audit
          path: |
            .audit/
            THIRD-PARTY-NOTICES.md

  precommit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  ledger-tests:
    name: ledger + ingest + agent determinism proof (Go + Rust, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Two genuinely different architectures — ubuntu-latest is x86_64,
        # macos-latest is arm64 (Apple Silicon runners) — per the Phase 1
        # gate's "10,000 randomly generated events ... across two
        # machines/architectures" requirement (phases/PHASES.md).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: go test ./... (ledger canonicalization/Merkle/epoch, ingest OCSF mapping/replay, agent backpressure buffer)
        run: |
          go mod tidy
          go test ./ledger/... -run TestGenerateGoldenVectors -v
          go test ./... -race -v

      - name: go build manifest_cli and merkle_cli (the JSON bridges services/adjudicate calls)
        run: |
          mkdir -p target/release
          go build -o target/release/manifest_cli ./ledger/cmd/manifest_cli
          go build -o target/release/merkle_cli ./ledger/cmd/merkle_cli

      - name: cargo test (independent Rust re-implementation + cross-language golden vectors)
        run: cargo test --manifest-path ledger/verify/Cargo.toml

      - name: cargo build --target wasm32-unknown-unknown (the browser verification path)
        run: cargo build --manifest-path ledger/verify/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Upload cross-language golden vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-vectors-${{ matrix.os }}
          path: testdata/golden_vectors.json

      - name: cargo test kernel (debug) -- determinism, no-panic fuzz-like property tests
        run: cargo test --manifest-path kernel/Cargo.toml

      - name: cargo test kernel (release) -- same properties, release profile
        run: cargo test --manifest-path kernel/Cargo.toml --release

      - name: cargo build kernel --target wasm32-unknown-unknown (native-vs-wasm cross-target proof, half 1)
        run: cargo build --manifest-path kernel/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Print native kernel fixed-scenario hashes (native-vs-wasm proof, half 2 + cross-arch input)
        run: cargo run --manifest-path kernel/Cargo.toml --release --bin print_fixed_hashes > kernel-hashes-${{ matrix.os }}.txt

      - name: Compare native vs wasm32 kernel execution (Node.js WebAssembly BigInt i64 comparison)
        run: node kernel/wasm_cross_check.mjs target/wasm32-unknown-unknown/release/attesta_kernel.wasm kernel-hashes-${{ matrix.os }}.txt

      - name: cargo build kernel --bins --release (adjudicate_cli, the JSON bridge services/investigate calls)
        run: cargo build --manifest-path kernel/Cargo.toml --release --bins

      - name: cargo test kernel/wasm_bridge -- JSON round-trip, determinism, and tamper-detection tests (native)
        run: cargo test --manifest-path kernel/wasm_bridge/Cargo.toml

      - name: cargo build kernel/wasm_bridge --target wasm32-unknown-unknown (the Verdict Ledger's browser verification path, Phase 11)
        run: cargo build --manifest-path kernel/wasm_bridge/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Install services/investigate (Claim Gate, provider abstraction, investigator loop)
        run: pip install -e "./services/investigate[dev]"

      - name: pytest services/investigate -- includes the real injection-containment gate against the built kernel CLI
        run: pytest services/investigate/tests -v

      - name: Install services/adjudicate (manifest sealing, transparency log, replay executor)
        run: pip install -e "./services/adjudicate[dev]"

      - name: pytest services/adjudicate -- Phase 7 (replay --pin/--rederive, export bundle) and Phase 8 (RVD sweep) gates
        run: pytest services/adjudicate/tests -v -s

      - name: Upload native kernel hashes (for the cross-architecture comparison job below)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hashes-${{ matrix.os }}
          path: kernel-hashes-${{ matrix.os }}.txt

  web-ui-gate:
    name: web UI foundation (lint, build, axe-core, keyboard traversal, screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Rust (Phase 11 -- builds the Verdict Ledger's kernel-verify.wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: npm install (root -- playwright + axe-core for the gate script)
        run: npm install --no-audit --no-fund

      - name: npm install (web/)
        run: cd web && npm install --no-audit --no-fund

      - name: npx playwright install --with-deps chromium
        run: npx playwright install --with-deps chromium

      - name: Build kernel/wasm_bridge for wasm32 and copy into web/public/ -- the exact binary the Verdict Ledger's browser panel loads and runs client-side (not a mock)
        run: |
          cargo build --manifest-path kernel/wasm_bridge/Cargo.toml --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/attesta_kernel_wasm_bridge.wasm web/public/kernel-verify.wasm

      - name: npm run lint (web/)
        run: cd web && npm run lint

      - name: npm run build (web/)
        run: cd web && npm run build

      - name: npm run start (background), wait for :3000, then run all eval/ui gate scripts
        # One step, not several: a background process started with `&` in
        # a GitHub Actions `run:` block doesn't reliably survive into a
        # later step (the runner tears down each step's process group),
        # so the server, the wait, and every gate script all have to
        # share this one shell. triage-flow.mjs is Phase 10's gate: the
        # end-to-end triage flow, 10k-row scroll fps, and the
        # blast-radius-gates-approve-button assertion. investigation-
        # canvas-flow.mjs and verdict-ledger-flow.mjs are Phase 11's:
        # the 10,000-node WebGL graph at >=55fps with real node/claim
        # selection and evidence verification, and the Verdict Ledger's
        # client-side WASM verification succeeding AND demonstrably
        # failing on a tampered claim set -- both against the real
        # kernel-verify.wasm just built above, not a mock.
        run: |
          (cd web && npm run start) &
          npx wait-on http://localhost:3000/login --timeout 60000
          node eval/ui/gate.mjs
          node eval/ui/triage-flow.mjs
          node eval/ui/investigation-canvas-flow.mjs
          node eval/ui/verdict-ledger-flow.mjs

      - name: Upload UI gate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-screenshots
          path: phases/reports/screenshots/

  kernel-cross-arch-check:
    name: kernel cross-architecture determinism (x86_64 vs arm64)
    needs: ledger-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernel-hashes-ubuntu-latest
          path: hashes/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: kernel-hashes-macos-latest
          path: hashes/macos
      - name: Diff x86_64 (ubuntu-latest) vs arm64 (macos-latest) fixed-scenario hashes
        run: |
          echo "ubuntu-latest (x86_64):"
          cat hashes/ubuntu/kernel-hashes-ubuntu-latest.txt
          echo "macos-latest (arm64):"
          cat hashes/macos/kernel-hashes-macos-latest.txt
          diff hashes/ubuntu/kernel-hashes-ubuntu-latest.txt hashes/macos/kernel-hashes-macos-latest.txt \
            && echo "IDENTICAL across architectures" \
            || (echo "DETERMINISM VIOLATION: kernel verdict hashes differ between x86_64 and arm64" && exit 1)
