[package]
name = "attesta-kernel-wasm-bridge"
version = "0.0.0"
edition = "2021"
publish = false
# Proprietary, same as kernel/ -- see kernel/Cargo.toml's comment. No
# `license` field; deny.toml's [licenses.private] skips unpublished
# workspace members.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
attesta-kernel = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
warnings = "deny"
