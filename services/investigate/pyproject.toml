[project]
name = "attesta-investigate"
version = "0.0.0"
description = "The Investigator: constrained LLM agent loop that proposes typed, evidence-cited Claims, and the Claim Gate that admits or rejects them before anything reaches the Adjudication Kernel. See docs/ARCHITECTURE.md 2.6-2.7."
requires-python = ">=3.12,<3.14"
license = { text = "UNLICENSED" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.setuptools]
packages = ["attesta_investigate"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
