# cargo-deny configuration — enforces docs/LICENSE-POLICY.md for the Rust workspace.
# Run: cargo deny check licenses

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]

[licenses]
version = 2
confidence-threshold = 0.9

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "PostgreSQL",
    "MPL-2.0",
    # OSI-approved permissive license covering Unicode Character Database
    # data files; carried by unicode-ident (a transitive dep of
    # proc-macro2/syn/serde_derive, pulled in by kernel/Cargo.toml's serde
    # dependency for the JSON CLI bridge — see adjudicate_cli.rs).
    "Unicode-3.0",
]

# Anything not in `allow` and not explicitly exempted below fails the build.
exceptions = []

# Our own crates (publish = false) are proprietary product code, not a
# dependency — see README.md "License". Don't require them to carry an
# SPDX `license` field the way a real third-party dependency must.
# NOTE: table keys after a `[header]` belong to that table until the next
# header — this must stay below every other `[licenses]` key, not above.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Explicit denylist mirrors docs/LICENSE-POLICY.md — belt and suspenders
    # against a transitive dependency reintroducing something we rejected.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "deny"
